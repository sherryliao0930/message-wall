<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>活動留言牆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F0E6; --paper-2:#EFE6D6; --ink:#2B2622; --ink-2:#5E554D; --line:#D9CCB8;
  --seal:#A61B22; --seal-dark:#7E1218;
  /* 卡片的五種柔和底色：每一種配墨黑字都在 11:1 以上 */
  --c0:#FBF7F0; --c1:#F4E2D2; --c2:#E2EAD8; --c3:#DCE6EE; --c4:#F3DDE0; --c5:#F2E8C6;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}

/* ---------- 共用：印章 ---------- */
.seal{display:inline-grid;place-items:center;background:var(--seal);color:var(--paper);
  font-family:var(--serif);font-weight:900;border-radius:4px;flex:none}

/* ---------- 連線狀態 ---------- */
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.live i{width:8px;height:8px;border-radius:50%;background:#B8AC9C}
.live.on i{background:#3E8E5A;box-shadow:0 0 0 0 rgba(62,142,90,.5);animation:ping 2.4s infinite}
.live.local i{background:#C58A2B}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(62,142,90,.45)}80%,100%{box-shadow:0 0 0 8px rgba(62,142,90,0)}}

/* ============================================================
   來賓端（手機）
   ============================================================ */
#guest{max-width:560px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.g-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.g-head .seal{width:42px;height:42px;font-size:22px}
.g-head h1{font-family:var(--serif);font-weight:900;font-size:21px;line-height:1.3;margin:0;flex:1}
.g-sec{padding:20px 0 6px}
.g-sec h2{font-family:var(--serif);font-size:17px;margin:0 0 4px;display:flex;align-items:baseline;gap:8px}
.g-sec h2 small{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--ink-2)}

.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:12px}
.mood{position:relative;border:1px solid var(--line);background:#FFFCF7;border-radius:16px;padding:10px 0 8px;
  display:flex;flex-direction:column;align-items:center;gap:2px;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;transition:transform .08s,border-color .2s,background .2s}
.mood .e{font-size:30px;line-height:1.15}
.mood .t{font-size:11px;color:var(--ink-2);white-space:nowrap}
.mood:active{transform:scale(.92)}
.mood.sel{border-color:var(--seal);background:#FBEDEA;box-shadow:inset 0 0 0 1px var(--seal)}
.mood .combo{position:absolute;top:-9px;right:-6px;background:var(--seal);color:#fff;font-size:12px;font-weight:700;
  padding:1px 7px;border-radius:999px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;pointer-events:none}
.mood .combo.show{opacity:1;transform:scale(1)}
.pop{position:fixed;pointer-events:none;font-size:30px;z-index:50;will-change:transform,opacity}
.goal{margin:6px 2px 0;padding:10px 12px;border-radius:12px;background:#FBEDEA;color:var(--seal-dark);font-size:13.5px;line-height:1.55}
.goal b{font-family:var(--serif);font-size:1.15em}
.goal .track{display:block;height:5px;border-radius:3px;background:rgba(166,27,34,.15);margin-top:7px;overflow:hidden}
.goal .track i{display:block;height:100%;background:var(--seal);border-radius:3px;transition:width .3s ease}
.tapnote{font-size:13px;color:var(--ink-2);margin:10px 2px 0;min-height:1.4em}

.field{display:block;margin-top:12px}
.field label{display:block;font-size:13px;color:var(--ink-2);margin:0 0 6px}
.field textarea,.field input{width:100%;border:1px solid var(--line);background:#FFFCF7;border-radius:12px;
  padding:12px 14px;font:inherit;font-size:16px;color:var(--ink);outline:none;transition:border-color .2s}
.field textarea{min-height:108px;resize:vertical;font-family:var(--serif);line-height:1.6}
.field textarea:focus,.field input:focus{border-color:var(--seal)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.count{text-align:right;font-size:12px;color:var(--ink-2);margin-top:4px}
.picked{font-size:13px;color:var(--ink-2);margin-top:12px}
.picked b{font-size:20px;vertical-align:-2px}
.send{width:100%;margin-top:14px;border:0;border-radius:14px;background:var(--seal);color:#fff;
  font-family:var(--serif);font-weight:700;font-size:18px;padding:14px;letter-spacing:.1em;transition:background .2s,opacity .2s}
.send:active{background:var(--seal-dark)}
.send:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;font-size:15px;opacity:0;
  transition:opacity .3s,transform .3s;z-index:60;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.g-cloud{position:relative;height:300px;margin-top:12px;border:1px solid var(--line);border-radius:16px;background:#FFFCF7;overflow:hidden}

/* ============================================================
   公布牆（投影）
   ============================================================ */
#wall{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
.w-head{display:flex;align-items:center;gap:1.2vw;padding:1.4vh 2.2vw;border-bottom:1px solid var(--line);position:relative;z-index:3;background:var(--paper)}
.w-head .seal{width:3.6vw;height:3.6vw;min-width:40px;min-height:40px;font-size:max(20px,1.9vw)}
.w-head h1{font-family:var(--serif);font-weight:900;font-size:max(22px,2.3vw);margin:0;letter-spacing:.04em}
.w-head .q{font-family:var(--serif);color:var(--ink-2);font-size:max(14px,1.15vw);margin-left:.4vw}
.w-head .stat{margin-left:auto;display:flex;gap:1.6vw;align-items:center;font-size:max(13px,1vw);color:var(--ink-2)}
.w-head .stat b{font-family:var(--serif);font-size:1.5em;color:var(--ink);margin-right:.2em}
.w-body{display:grid;grid-template-columns:1fr 33vw;min-height:0}

/* 留言的舞台：底下有三團很淡的色光緩緩漂移，像在呼吸 */
#stage{position:relative;overflow:hidden;min-height:0}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
.blob.b1{width:46vw;height:46vw;left:-10vw;top:-12vw;background:#F1D9C6;animation:drift1 38s ease-in-out infinite alternate}
.blob.b2{width:40vw;height:40vw;right:-12vw;bottom:-14vw;background:#D9E4EC;animation:drift2 44s ease-in-out infinite alternate}
.blob.b3{width:30vw;height:30vw;left:24vw;top:26vh;background:#E6EBD9;animation:drift3 52s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(12vw,10vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-10vw,-12vh) scale(.9)}}
@keyframes drift3{to{transform:translate(-8vw,8vh) scale(1.2)}}

.card{position:absolute;z-index:6}
.card-in{position:relative;border-radius:22px;padding:1.05em 1.25em .85em;background:var(--c0);
  box-shadow:0 1px 0 rgba(43,38,34,.04),0 10px 30px -14px rgba(43,38,34,.28);
  animation:breathe 8s ease-in-out infinite;transform-origin:50% 60%;cursor:pointer}
.card.c1 .card-in{background:var(--c1)} .card.c2 .card-in{background:var(--c2)}
.card.c3 .card-in{background:var(--c3)} .card.c4 .card-in{background:var(--c4)} .card.c5 .card-in{background:var(--c5)}
.card .body{margin:0;font-family:var(--serif);font-weight:700;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.card .who{margin-top:.45em;font-size:.56em;color:var(--ink-2);font-family:var(--sans);display:flex;gap:.6em;align-items:center}
.card .who .kw{border:1px solid currentColor;border-radius:999px;padding:0 .7em;font-size:.95em}
.card .mood-b{position:absolute;top:-.55em;left:-.35em;font-size:1.25em;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
/* 進場：從模糊、縮小的狀態「綻開」 */
.card.bloom{animation:bloom 1.4s cubic-bezier(.2,.8,.2,1) both}
.card.fresh .card-in::after{content:"";position:absolute;inset:-6px;border-radius:26px;border:2px solid var(--seal);
  animation:ring 2.6s ease-out 3 both;pointer-events:none}
.card.leave{transition:opacity 1.6s ease,transform 1.6s ease,filter 1.6s ease;opacity:0;transform:scale(.92) translateY(-10px);filter:blur(4px)}
@keyframes bloom{0%{opacity:0;transform:scale(.55);filter:blur(10px)}60%{opacity:1;filter:blur(0)}100%{opacity:1;transform:scale(1);filter:blur(0)}}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1) rotate(var(--rot,0deg))}50%{transform:translateY(-6px) scale(1.025) rotate(var(--rot,0deg))}}
@keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}

.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink-2);font-family:var(--serif);font-size:max(18px,1.6vw);line-height:1.9;pointer-events:none}
.empty b{display:block;font-size:2.2em;color:var(--ink);animation:breathe 6s ease-in-out infinite}

/* 右欄：文字雲 + 心情能量 + QR */
.aside{display:grid;grid-template-rows:auto 1fr auto;border-left:1px solid var(--line);min-height:0;background:rgba(246,240,230,.92);position:relative;z-index:7}
.a-title{display:flex;align-items:baseline;justify-content:space-between;padding:1.6vh 1.6vw .4vh;font-family:var(--serif);font-weight:700;font-size:max(15px,1.15vw)}
.a-title small{font-family:var(--sans);font-weight:400;font-size:.75em;color:var(--ink-2)}
#wallCloud{position:relative;min-height:0;margin:0 .6vw}
.a-foot{border-top:1px solid var(--line);padding:1.4vh 1.4vw 1.6vh;display:grid;grid-template-columns:1fr auto;gap:1.2vw;align-items:end}
.meters{display:grid;grid-template-columns:repeat(5,1fr);gap:.6vh .4vw}
.meter{display:flex;flex-direction:column;align-items:center;font-size:max(12px,.85vw);color:var(--ink-2)}
.meter .e{font-size:max(22px,1.9vw);line-height:1.2;display:inline-block}
.meter b{font-family:var(--serif);color:var(--ink);font-size:1.15em;font-variant-numeric:tabular-nums}
.meter .bar{width:78%;height:4px;border-radius:2px;background:var(--line);margin-top:3px;overflow:hidden}
.meter .bar i{display:block;height:100%;width:0;background:var(--seal);border-radius:2px;transition:width .5s ease}
.meter .e.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.qr{text-align:center;font-size:max(11px,.8vw);color:var(--ink-2);cursor:zoom-in}
.qr canvas,.qr img{display:block;width:min(10.5vw,19vh);height:auto;border-radius:6px;margin:0 auto .4vh;box-shadow:0 0 0 1px var(--line)}
.qr .ph{width:min(10.5vw,19vh);aspect-ratio:1;display:grid;place-items:center;border:1px dashed var(--line);border-radius:6px;padding:6px;line-height:1.5}

/* 文字雲 */
.cloud .w{position:absolute;white-space:nowrap;font-family:var(--serif);line-height:1;
  transition:left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),font-size .9s cubic-bezier(.2,.8,.2,1),opacity .6s}
.cloud .w.v{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.06em}
.cloud .w.enter{opacity:0}
.cloud .w.glow{animation:glow 2.4s ease-out}
@keyframes glow{0%{text-shadow:0 0 0 rgba(166,27,34,0)}25%{text-shadow:0 0 18px rgba(166,27,34,.55)}100%{text-shadow:0 0 0 rgba(166,27,34,0)}}
.cloud-empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);font-size:14px;text-align:center;line-height:1.7;padding:12px}

/* 心情 emoji：沒有框，直接在空白處慢慢浮現、緩緩上飄、再淡去 */
#fx{display:none}
.sticker{position:absolute;z-index:5;display:flex;align-items:flex-end;gap:.15em;pointer-events:none;white-space:nowrap;opacity:0}
.sticker .e{font-size:1.6em;line-height:1;filter:drop-shadow(0 4px 6px rgba(43,38,34,.15))}
.sticker b{font-family:var(--serif);font-weight:900;color:var(--seal);font-size:.62em;font-variant-numeric:tabular-nums;margin-bottom:.1em}
/* 謝謝大家：最常被按的 emoji 長到很大，搭配全螢幕彩帶 */
.thanks{position:fixed;left:50%;top:48%;z-index:9;pointer-events:none;text-align:center;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:900;color:var(--seal)}
.thanks .e{display:block;line-height:1;font-size:12vh;filter:drop-shadow(0 14px 24px rgba(43,38,34,.22))}
.thanks .t{display:block;margin-top:2vh;font-size:7vh;letter-spacing:.14em;text-shadow:0 0 18px var(--paper),0 0 6px var(--paper),0 0 2px var(--paper)}
.thanks .s{display:block;margin-top:.6vh;font-size:2.6vh;color:var(--ink-2);font-weight:700;letter-spacing:.06em;text-shadow:0 0 10px var(--paper),0 0 3px var(--paper)}
.thanks::before{content:"";position:absolute;inset:-8vh -14vw;z-index:-1;background:radial-gradient(closest-side,rgba(246,240,230,.94) 55%,rgba(246,240,230,0))}
#confetti{position:fixed;inset:0;width:100vw;height:100vh;z-index:8;pointer-events:none}

/* 移除留言的小選單 */
.menu{position:fixed;z-index:20;background:var(--ink);color:var(--paper);border-radius:12px;padding:6px;display:flex;gap:6px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.menu button{border:0;background:transparent;color:inherit;padding:8px 12px;border-radius:8px;font-size:14px}
.menu button:hover{background:rgba(255,255,255,.12)}
.menu .danger{color:#FFB4B4}

/* 牆的工具列：滑鼠動一下才出現，投影時不干擾 */
.tools{position:fixed;right:16px;bottom:16px;z-index:10;display:flex;gap:8px;opacity:0;transition:opacity .4s;pointer-events:none}
.tools.show{opacity:1;pointer-events:auto}
.tools button{border:1px solid var(--line);background:#FFFCF7;border-radius:999px;padding:8px 14px;font-size:13px}
.tools button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* QR 放大 */
.qrbig{position:fixed;inset:0;z-index:30;background:rgba(246,240,230,.97);display:grid;place-items:center;text-align:center;cursor:zoom-out;font-family:var(--serif)}
.qrbig canvas,.qrbig img{width:min(70vh,80vw);height:auto;display:block;margin:0 auto 2vh}
.qrbig p{font-size:3vh;margin:0}

@media (max-aspect-ratio:1/1){
  /* 直立的平板或手機開牆：留言在上、文字雲與心情在下 */
  .w-body{grid-template-columns:1fr;grid-template-rows:1fr 40vh}
  .aside{border-left:0;border-top:1px solid var(--line)}
  .w-head .q{display:none}
  .meter{font-size:12px}
  .meter .e{font-size:clamp(22px,3.6vw,34px)}
  .qr canvas,.qr img,.qr .ph{width:min(22vw,15vh)}
}
@media (max-width:760px){
  .w-head{gap:10px;padding:10px 14px}
  .w-head .seal{width:36px;height:36px;min-width:36px;min-height:36px;font-size:20px}
  .w-head h1{font-size:18px;line-height:1.3}
  .w-head .stat{gap:10px;font-size:12px}
  .w-head .stat b{font-size:1.25em}
  .w-head .live span{display:none}
  .a-title{padding:10px 14px 2px;font-size:15px}
  .a-title small{display:none}
  .a-foot{padding:10px 14px 12px}
  .tools{left:12px;right:12px;bottom:12px;flex-wrap:wrap;justify-content:flex-end}
  .tools button{padding:9px 13px}
}
.thanks .t{font-size:min(7vh,12vw)}
.thanks .s{font-size:min(2.6vh,4vw)}
/* 平板以上的來賓頁：版面放寬、字放大，拿在手上讀起來舒服 */
@media (min-width:700px){
  #guest{max-width:720px;padding:32px 32px 56px}
  .g-head .seal{width:52px;height:52px;font-size:28px}
  .g-head h1{font-size:28px}
  .g-sec{padding-top:28px}
  .g-sec h2{font-size:21px}
  .g-sec h2 small{font-size:15px}
  .moods{gap:12px}
  .mood{padding:14px 0 12px;border-radius:18px}
  .mood .e{font-size:44px}
  .mood .t{font-size:14px}
  .tapnote,.goal,.picked{font-size:15px}
  .field label{font-size:15px}
  .field textarea,.field input{font-size:18px;padding:14px 16px}
  .field textarea{min-height:140px}
  .send{font-size:20px;padding:16px}
  .g-cloud{height:420px}
}
@media (prefers-reduced-motion:reduce){
  .card-in,.blob,.empty b{animation:none!important}
}
</style>
</head>
<body>

<!-- ===================== 來賓端 ===================== -->
<main id="guest" class="hide">
  <header class="g-head">
    <span class="seal">厝</span>
    <h1 id="gTitle"></h1>
    <span class="live" id="gLive"><i></i><span>連線中</span></span>
  </header>

  <section class="g-sec">
    <h2>此刻的心情 <small>可以一直按，牆上會湧現！</small></h2>
    <div class="moods" id="moods"></div>
    <p class="tapnote" id="tapNote">點一下選心情，連按就是替自己和隊友加油</p>
    <p class="goal" id="goal">每個心情全場每滿 50 下，大螢幕就會放大說「謝謝大家」還會灑彩帶 🎉</p>
  </section>

  <section class="g-sec">
    <h2 id="gQuestion"></h2>
    <form id="form" autocomplete="off">
      <div class="field">
        <textarea id="body" maxlength="120" placeholder="一句話、一段感想都好" required></textarea>
        <div class="count"><span id="bodyCount">0</span> / 120</div>
      </div>
      <div class="row2">
        <div class="field" style="margin-top:4px">
          <label for="name">您的姓名</label>
          <input id="name" maxlength="12" placeholder="例如：王小明">
        </div>
        <div class="field" style="margin-top:4px">
          <label for="kw">用一個詞形容今天</label>
          <input id="kw" maxlength="8" placeholder="例如：好好玩">
        </div>
      </div>
      <p class="picked" id="picked">還沒選心情（上面點一下就會附在留言上）</p>
      <button class="send" id="send" type="submit">送上牆</button>
    </form>
  </section>

  <section class="g-sec">
    <h2>大家的文字雲 <small>即時更新</small></h2>
    <div class="g-cloud cloud" id="guestCloud"></div>
  </section>
  <div class="toast" id="toast"></div>
</main>

<!-- ===================== 公布牆 ===================== -->
<div id="wall" class="hide">
  <header class="w-head">
    <span class="seal">厝</span>
    <h1 id="wTitle"></h1>
    <span class="q" id="wQuestion"></span>
    <div class="stat">
      <span><b id="statMsg">0</b>則留言</span>
      <span><b id="statReact">0</b>次心情</span>
      <span class="live" id="wLive"><i></i><span>連線中</span></span>
    </div>
  </header>
  <div class="w-body">
    <section id="stage">
      <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
      <div class="empty" id="stageEmpty"><div><b>☺</b>掃右下角的 QR Code<br>寫下你此刻的感受</div></div>
    </section>
    <aside class="aside">
      <div class="a-title">大家的關鍵詞 <small id="cloudNote">同一個詞越多人寫就越大</small></div>
      <div id="wallCloud" class="cloud"></div>
      <div class="a-foot">
        <div class="meters" id="meters"></div>
        <div class="qr" id="qr" title="點一下放大"></div>
      </div>
    </aside>
  </div>
  <div id="fx"></div>
  <div class="tools" id="tools">
    <button id="tExcel">下載留言 Excel</button>
    <button id="tImg">下載文字雲圖片</button>

<script>
'use strict';
/* ============================================================
   設定
   ============================================================ */
var SUPABASE_URL = 'https://qdpklfsrgdtgbsutckib.supabase.co';
var SUPABASE_KEY = 'sb_publishable_e1XwlArxGr9KKwOtIsGDwQ_4I17iX4F';

var P = new URLSearchParams(location.search);
var ROOM = (P.get('room') || 'default').slice(0, 40);
var IS_WALL = P.has('wall');
var TITLE = P.get('title') || '2026牽手行厝邊闖關活動';
var QUESTION = P.get('q') || '此刻，你想說些什麼？';

var MOODS = [
  { e:'😄', t:'好喜樂' }, { e:'🤩', t:'好好玩' }, { e:'🥳', t:'超有成就感' }, { e:'😍', t:'好喜歡' }, { e:'🤗', t:'抱抱' },
  { e:'😘', t:'飛吻' },   { e:'😉', t:'眨眼' },   { e:'😚', t:'瞇眼親親' },   { e:'❣️', t:'心嘆號' }, { e:'💯', t:'一百分' }
];
var MOOD_SET = new Set(MOODS.map(function(m){ return m.e; }));

function $(id){ return document.getElementById(id); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function rand(a, b){ return a + Math.random() * (b - a); }
function hash(s){ var h = 2166136261; for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function isCJK(s){ return /[㐀-䶿一-鿿]/.test(s); }

/* ============================================================
   資料層：優先接 Supabase；資料表還沒建好或連不上時，
   退成「本機示範模式」（同一台電腦的分頁之間用 BroadcastChannel 同步）
   ============================================================ */
var Store = {
  mode: 'connecting',
  messages: new Map(),      // id → message（不含已移除的）
  totals: {},               // emoji → 總數
  handlers: { msg: [], react: [], hide: [], status: [] },
  on: function(t, f){ this.handlers[t].push(f); },
  emit: function(t, x){ this.handlers[t].forEach(function(f){ f(x); }); },
  sorted: function(){ return Array.from(this.messages.values()).sort(function(a, b){ return a.id - b.id; }); }
};
var sb = null, bc = null, LKEY = 'wall:' + ROOM + ':';

function acceptMessage(m, fromLive){
  if (!m || m.hidden || Store.messages.has(m.id)) return;
  Store.messages.set(m.id, m);
  Store.emit('msg', { m: m, live: fromLive });
}
function acceptReaction(emoji, n){
  if (!MOOD_SET.has(emoji)) return;
  Store.totals[emoji] = (Store.totals[emoji] || 0) + n;
  Store.emit('react', { emoji: emoji, n: n });
}
function acceptHide(id){
  if (!Store.messages.has(id)) return;
  Store.messages.delete(id);
  Store.emit('hide', id);
}
function setMode(mode){ Store.mode = mode; Store.emit('status', mode); }

async function initStore(){
  if (window.supabase && window.supabase.createClient){
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
      var r = await sb.from('wall_messages').select('id,name,body,mood,keyword,created_at')
        .eq('room', ROOM).eq('hidden', false).order('id', { ascending: false }).limit(1000);
      if (r.error) throw r.error;
      var t = await sb.from('wall_reaction_totals').select('emoji,total').eq('room', ROOM);
      if (t.error) throw t.error;
      r.data.reverse().forEach(function(m){ acceptMessage(m, false); });
      t.data.forEach(function(row){ Store.totals[row.emoji] = Number(row.total) || 0; });
      Store.emit('react', null);
      subscribeCloud();
      return;
    } catch (e){
      console.warn('[留言牆] Supabase 無法使用，改用本機示範模式：', e && (e.message || e.code || e));
      sb = null;
    }
  }
  initLocal();
}

function subscribeCloud(){
  var filter = 'room=eq.' + ROOM;
  sb.channel('wall-' + ROOM + '-' + Math.random().toString(36).slice(2, 7))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'wall_messages', filter: filter },
        function(p){ acceptMessage(p.new, true); })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'wall_messages', filter: filter },
        function(p){ if (p.new && p.new.hidden) acceptHide(p.new.id); })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'wall_reactions', filter: filter },
        function(p){ acceptReaction(p.new.emoji, p.new.n || 1); })
    .subscribe(function(status){
      if (status === 'SUBSCRIBED'){ setMode('cloud'); resync(); }
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') setMode('cloud-off');
    });
  // 即時通道偶爾會斷：每 30 秒補抓一次新留言，回到前景時也補一次
  setInterval(resync, 30000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) resync(); });
}

async function resync(){
  if (!sb) return;
  var last = 0;
  Store.messages.forEach(function(m){ if (m.id > last) last = m.id; });
  var r = await sb.from('wall_messages').select('id,name,body,mood,keyword,created_at')
    .eq('room', ROOM).eq('hidden', false).gt('id', last).order('id').limit(200);
  if (!r.error) r.data.forEach(function(m){ acceptMessage(m, true); });
}

function localLoad(k, d){ try { return JSON.parse(localStorage.getItem(LKEY + k)) || d; } catch (e){ return d; } }
function localSave(k, v){ try { localStorage.setItem(LKEY + k, JSON.stringify(v)); } catch (e){} }

function initLocal(){
  localLoad('msgs', []).forEach(function(m){ acceptMessage(m, false); });
  Store.totals = localLoad('totals', {});
  Store.emit('react', null);
  if ('BroadcastChannel' in window){
    bc = new BroadcastChannel(LKEY);
    bc.onmessage = function(ev){
      var d = ev.data || {};
      if (d.type === 'msg') acceptMessage(d.m, true);
      else if (d.type === 'react') acceptReaction(d.emoji, d.n);
      else if (d.type === 'hide') acceptHide(d.id);
    };
  }
  setMode('local');
}

var api = {
  addMessage: async function(m){
    if (sb){
      var r = await sb.from('wall_messages').insert(Object.assign({ room: ROOM }, m))
        .select('id,name,body,mood,keyword,created_at').single();
      if (r.error) throw r.error;
      acceptMessage(r.data, true);
      return;
    }
    var msg = Object.assign({ id: Date.now() * 1000 + Math.floor(Math.random() * 1000), created_at: new Date().toISOString() }, m);
    var all = localLoad('msgs', []); all.push(msg); localSave('msgs', all.slice(-500));
    if (bc) bc.postMessage({ type: 'msg', m: msg });
    acceptMessage(msg, true);
  },
  react: async function(emoji, n){
    if (sb){
      var r = await sb.from('wall_reactions').insert({ room: ROOM, emoji: emoji, n: n });
      if (r.error) throw r.error;
      return;   // 自己的反應會從即時通道回來，不必在這裡加
    }
    var tt = localLoad('totals', {}); tt[emoji] = (tt[emoji] || 0) + n; localSave('totals', tt);
    if (bc) bc.postMessage({ type: 'react', emoji: emoji, n: n });
    acceptReaction(emoji, n);
  },
  hide: async function(id){
    if (sb){
      var r = await sb.from('wall_messages').update({ hidden: true }).eq('id', id);
      if (r.error) throw r.error;
    } else {
      localSave('msgs', localLoad('msgs', []).filter(function(m){ return m.id !== id; }));
      if (bc) bc.postMessage({ type: 'hide', id: id });
    }
    acceptHide(id);
  }
};

function paintLive(el){
  var map = { connecting: ['', '連線中'], cloud: ['on', '即時同步'], 'cloud-off': ['', '重新連線中'], local: ['local', '本機示範模式'] };
  Store.on('status', function(mode){
    var v = map[mode] || map.connecting;
    el.className = 'live ' + v[0];
    el.lastElementChild.textContent = v[1];
    el.title = mode === 'local' ? '資料表尚未建立或連不上 Supabase：只在這台電腦的分頁之間同步' : '';
  });
}

var CJK_RE = /^[㐀-䶿一-鿿豈-﫿]+$/;
var HAS_LETTER_RE = /[㐀-䶿一-鿿豈-﫿A-Za-z]/;

function mergeAdjacent(items){
  var out = [], i = 0;
  while (i < items.length){
    var j = i, total = 0;
    while (j < items.length && CJK_RE.test(items[j].text) && (j === i || items[j].start === items[j - 1].end)){
      total += items[j].text.length; j++;
    }
    if (j - i <= 1){ out.push(items[i].text); i++; continue; }
    if (total <= 4){
      var joined = ''; for (var k = i; k < j; k++) joined += items[k].text; out.push(joined);
    } else {
      var buf = '';
      for (var m = i; m < j; m++){
        var t = items[m].text;
        if (t.length === 1){ buf += t; continue; }
        if (buf){ out.push(buf); buf = ''; }
        out.push(t);
      }
      if (buf) out.push(buf);
    }

  }
  return out;
}

var segmenter = (window.Intl && Intl.Segmenter) ? new Intl.Segmenter('zh-Hant', { granularity: 'word' }) : null;
function extractKeywords(raw){
  var text = String(raw || '').trim();
  if (!text) return [];
  var pieces = [];
  if (segmenter){
    Array.from(segmenter.segment(text)).forEach(function(s){
      if (!s.isWordLike) return;
      var w = s.segment.trim();
      if (!w || STOPWORDS.has(w.toLowerCase())) return;
      pieces.push({ text: w, start: s.index, end: s.index + s.segment.length });
    });
  }
  var out = [], seen = new Set();
  mergeAdjacent(pieces).forEach(function(w){
    w = w.trim();
    if (!w || w.length > 12 || !HAS_LETTER_RE.test(w)) return;
    if (w.length === 1 && CJK_RE.test(w)) return;
    var key = w.toLowerCase();
    if (STOPWORDS.has(key) || seen.has(key)) return;
    seen.add(key); out.push(w);
  });
  return out;
}

/* 文字雲的計票：來賓自己填的「一個詞」最準，有填就只用它；
   沒填的留言才從內文自動抽詞（最多 2 個）—— 自動斷詞難免抽到碎片，
   能少用就少用。 */
var kwCache = new Map();
function wordsOf(m){
  if (kwCache.has(m.id)) return kwCache.get(m.id);
  var list = [];
  var own = String(m.keyword || '').trim().replace(/[\s，,。.!！?？]+/g, '');
  if (own) list.push({ w: own, n: 1 });
  else extractKeywords(m.body).slice(0, 2).forEach(function(w){ list.push({ w: w, n: 1 }); });
  kwCache.set(m.id, list);
  return list;
}
function countWords(msgs){
  var c = new Map();
  (msgs || Store.messages).forEach(function(m){
    wordsOf(m).forEach(function(x){
      var key = x.w.toLowerCase();
      var cur = c.get(key) || { text: x.w, n: 0 };
      cur.n += x.n; c.set(key, cur);
    });
  });
  return Array.from(c.values()).sort(function(a, b){ return b.n - a.n || a.text.localeCompare(b.text, 'zh-Hant'); });
}

/* ============================================================
   文字雲排版：由大到小，沿阿基米德螺線找不重疊的位置
   ============================================================ */
var measurer = document.createElement('canvas').getContext('2d');
var CLOUD_COLORS = ['#A61B22', '#2B2622', '#7E3B1E', '#3D5A4A', '#2F4A66', '#8A2F4D', '#5E4B2B'];
function weightFor(t){ return t > 0.66 ? 900 : (t > 0.30 ? 700 : 500); }
function measure(text, size, vertical, weight){
  var pad = Math.max(3, size * 0.10), w, h;
  if (vertical){ w = size * 1.12; h = size * 1.06 * text.length; }
  else { measurer.font = weight + ' ' + size + 'px "Noto Serif TC","Songti TC",serif'; w = measurer.measureText(text).width; h = size * 1.16; }
  return { w: w + pad * 2, h: h + pad * 2, pad: pad };
}
function hits(b, placed){
  for (var i = 0; i < placed.length; i++){
    var p = placed[i];
    if (b.x < p.x + p.w && b.x + b.w > p.x && b.y < p.y + p.h && b.y + b.h > p.y) return true;
  }
  return false;
}
function layout(list, W, H, maxSize, minSize, edge, allowShrink){
  var placed = [], result = [];
  var maxN = list[0].n, minN = list[list.length - 1].n, span = Math.max(1, maxN - minN);
  var cx = W / 2, cy = H / 2, aspect = W / H, maxR = Math.sqrt(W * W + H * H) / 2;
  for (var i = 0; i < list.length; i++){
    var item = list[i];
    var t = (maxN === minN) ? 0.62 : (item.n - minN) / span;
    var size = minSize + (maxSize - minSize) * Math.pow(t, 0.85);   // 出現越多次字越大
    var weight = weightFor(t);
    var vertical = isCJK(item.text) && item.text.length >= 2 && item.text.length <= 5 && (hash(item.text) % 5 === 0);
    var spot = null;
    for (var attempt = 0; attempt < (allowShrink ? 3 : 1) && !spot; attempt++){
      var s = size * [1, 0.78, 0.58][attempt];
      if (s < 10) break;
      var m = measure(item.text, s, vertical, weight);
      if (m.w > W - edge * 2 || m.h > H - edge * 2) continue;
      for (var step = 0; step < 5200; step++){
        var ang = step * 0.30, r = 0.85 * ang;
        if (r > maxR * 1.2) break;
        var x = cx + r * Math.cos(ang) * (aspect > 1 ? aspect * 0.92 : 1) - m.w / 2;
        var y = cy + r * Math.sin(ang) * (aspect < 1 ? (1 / aspect) * 0.92 : 1) - m.h / 2;
        if (x < edge || y < edge || x + m.w > W - edge || y + m.h > H - edge) continue;
        var box = { x: x, y: y, w: m.w, h: m.h };
        if (!hits(box, placed)){ placed.push(box); spot = { x: x + m.pad, y: y + m.pad, size: s, vertical: vertical }; break; }
      }
    }
    if (spot) result.push({ text: item.text, n: item.n, x: spot.x, y: spot.y, size: spot.size, vertical: spot.vertical, weight: weight, t: t });
  }
  return result;
}

function makeCloud(el, maxWords){
  var nodes = new Map(), timer = 0, lastCounts = new Map();
  function render(){
    timer = 0;
    var list = countWords().slice(0, maxWords);
    var W = el.clientWidth, H = el.clientHeight;
    var empty = el.querySelector('.cloud-empty');
    if (!list.length){
      nodes.forEach(function(n){ n.remove(); }); nodes.clear();
      if (!empty){ empty = document.createElement('div'); empty.className = 'cloud-empty'; empty.textContent = '留言送出後，關鍵詞會在這裡長出來'; el.appendChild(empty); }
      return;
    }
    if (empty) empty.remove();
    if (W < 40 || H < 40) return;
    var edge = clamp(Math.min(W, H) * 0.05, 10, 32), iw = W - edge * 2, ih = H - edge * 2;
    var base = Math.sqrt((iw * ih) / Math.max(8, list.length));
    var maxSize = clamp(base * 1.0, 22, Math.min(iw * 0.42, ih * 0.36));
    var minSize = clamp(base * 0.24, 12, maxSize * 0.30);
    var out = layout(list, W, H, maxSize, minSize, edge), tries = 0;
    // 放不下時整體等比縮小重排，大小順序不變；最後一輪才允許個別詞縮小擠進去
    while (out.length < list.length && tries < 4){ maxSize *= 0.84; minSize = Math.max(11, minSize * 0.9); tries++; out = layout(list, W, H, maxSize, minSize, edge, tries === 4); }

    var keep = new Set();
    out.forEach(function(p){
      var key = p.text.toLowerCase(); keep.add(key);
      var n = nodes.get(key), isNew = !n;
      if (isNew){
        n = document.createElement('span'); n.className = 'w enter';
        n.textContent = p.text; el.appendChild(n); nodes.set(key, n);
        setTimeout(function(){ n.classList.remove('enter'); }, 30);   // 不用 rAF：背景分頁會凍結
      }
      n.classList.toggle('v', p.vertical);
      n.style.left = p.x + 'px'; n.style.top = p.y + 'px';
      n.style.fontSize = p.size + 'px'; n.style.fontWeight = p.weight;
      n.style.color = CLOUD_COLORS[hash(p.text) % CLOUD_COLORS.length];
      n.style.opacity = (0.86 + 0.14 * p.t).toFixed(2);
      n.title = p.text + '：' + p.n + ' 次';
      var before = lastCounts.get(key) || 0;
      if (!isNew && p.n > before){ n.classList.remove('glow'); void n.offsetWidth; n.classList.add('glow'); }
      lastCounts.set(key, p.n);
    });
    nodes.forEach(function(n, key){ if (!keep.has(key)){ n.remove(); nodes.delete(key); } });
  }
  function schedule(){ if (!timer) timer = setTimeout(render, 220); }   // 爆量時合併成一次重排
  new ResizeObserver(schedule).observe(el);
  Store.on('msg', schedule); Store.on('hide', schedule);
  return { render: schedule };
}

    }

}

    var x = rand(pad, W - w - pad), y = rand(pad + 8, H - h - pad);
    var d = Infinity, ok = true;
    for (var j = 0; j < others.length; j++){
      var v = others[j];
      var gx = Math.max(v.x - (x + w), x - (v.x + v.w), 0);
      var gy = Math.max(v.y - (y + h), y - (v.y + v.h), 0);
      if (gx < pad && gy < pad){ ok = false; break; }
      d = Math.min(d, Math.hypot(gx, gy));
    }
    if (!ok) continue;
    if (d > bestD){ bestD = d; best = { x: x, y: y }; }
  }
  return best;
}

function coverage(){
  var a = 0; visible.forEach(function(v){ a += v.w * v.h; });
  return a / (stage.clientWidth * stage.clientHeight);
}

function showMessage(m, fresh){
  if (visible.some(function(v){ return v.m.id === m.id; })) return false;
  var el = buildCard(m, fresh);
  stage.appendChild(el);
  var w = el.offsetWidth, h = el.offsetHeight;
  // 畫面最多鋪到 45%：留白是韻律的一部分
  while (visible.length && coverage() + (w * h) / (stage.clientWidth * stage.clientHeight) > 0.45){
    if (!retire(oldest())) break;
  }
  var spot = findSpot(w, h), guard = 0;
  while (!spot && visible.length && guard++ < 6){ retire(oldest()); spot = findSpot(w, h); }
  if (!spot){ el.remove(); return false; }
  el.style.left = spot.x + 'px'; el.style.top = spot.y + 'px';
  el.style.visibility = '';
  el.classList.add('bloom');
  lastBloom = Date.now();
  visible.push({ m: m, el: el, x: spot.x, y: spot.y, w: w, h: h, at: Date.now(), fresh: fresh });
  if (fresh) setTimeout(function(){ el.classList.remove('fresh'); }, 8000);
  updateStats();
  return true;
}

function oldest(){
  var list = visible.slice().sort(function(a, b){ return a.at - b.at; });
  return list[0];
}
function retire(v){
  if (!v) return false;
  visible = visible.filter(function(x){ return x !== v; });   // 位置立刻讓出來
  v.el.classList.remove('bloom'); v.el.classList.add('leave');
  setTimeout(function(){ v.el.remove(); }, 1700);
  return true;
}

/* 開牆時：先擺最近的留言，直到畫面舒服地滿 */
function fillStage(){
  var all = Store.sorted();
  queue = all; cursor = 0;
  var recent = all.slice(-14).reverse();
  for (var i = 0; i < recent.length; i++){
    if (coverage() > 0.38) break;
    showMessage(recent[i], false);
  }
  updateStats();
}

/* 輪播：留言比畫面放得下的多時，每隔幾秒讓最久的一張淡出、換一張舊留言浮上來，
   讓每一則都有機會被看見 */
function rotate(){
  var all = Store.sorted();
  if (!all.length || document.hidden) return;
  var shown = new Set(visible.map(function(v){ return v.m.id; }));
  var candidates = all.filter(function(m){ return !shown.has(m.id); });
  if (!candidates.length) return;
  var old = oldest();
  if (old && Date.now() - old.at > 15000 && coverage() > 0.30) retire(old);
  cursor = cursor % candidates.length;
  var next = candidates[cursor++];
  setTimeout(function(){ showMessage(next, false); }, 900);
}

/* ---------- 心情 emoji ----------
   按幾次就出現幾個，排隊依序浮現：平常每 0.18 秒一個，排隊很長時 0.11 秒。
   每個 emoji 的大小跟著「它的累計次數」走 —— 全場最常被按的那個最大。
   剛有新留言綻開時先停一下，不跟留言卡搶同一個瞬間。 */
var MAX_STICKERS = reduced ? 6 : 22;
var MAX_QUEUE = 200;          // 全場狂按時排隊上限，超過的就不再補播（累計數字仍照算）
var stickers = [], emojiQueue = [], lastBloom = 0;

function rain(emoji, n){
  for (var i = 0; i < n && emojiQueue.length < MAX_QUEUE; i++) emojiQueue.push(emoji);
  checkMilestone(emoji);
}

(function emojiTick(){
  var wait = emojiQueue.length > 40 ? 110 : 180;
  if (stage && !document.hidden && emojiQueue.length && Date.now() - lastBloom > 1000 && !celebrating){
    placeSticker(emojiQueue.shift());
  }
  setTimeout(emojiTick, wait);
})();

/* 0.8 倍（很少人按）到 1.45 倍（全場第一名）——差距保留，但不要大到滿版都是 emoji */
function sizeFor(emoji){
  var max = 0; MOODS.forEach(function(m){ max = Math.max(max, Store.totals[m.e] || 0); });
  var t = max ? (Store.totals[emoji] || 0) / max : 0;
  return 0.8 + 0.65 * Math.sqrt(t);
}

function placeSticker(emoji){
  if (stickers.length >= MAX_STICKERS) fadeAway(stickers[0]);
  var k = scale() * sizeFor(emoji) * rand(0.92, 1.08);
  var el = document.createElement('div');
  el.className = 'sticker';
  el.style.fontSize = (16 * k) + 'px';
  el.innerHTML = '<span class="e"></span>';
  el.querySelector('.e').textContent = emoji;
  el.style.visibility = 'hidden';
  stage.appendChild(el);
  var w = el.offsetWidth, h = el.offsetHeight, rise = 70 * scale();
  // 找不到完全空的位置也照樣出現（emoji 在卡片後面，不會擋字）——按幾次就要看到幾個
  var spot = findSpot(w, h + rise, stickers) || { x: rand(0, stage.clientWidth - w), y: rand(0, stage.clientHeight - h - rise) };
  var rot = rand(-12, 12), rot2 = rot + rand(-8, 8);
  el.style.left = spot.x + 'px'; el.style.top = (spot.y + rise) + 'px';
  el.style.visibility = '';
  var rec = { el: el, x: spot.x, y: spot.y, w: w, h: h + rise };
  stickers.push(rec);
  rec.anim = el.animate([
    { transform: 'translateY(10px) scale(.6) rotate(' + rot + 'deg)', opacity: 0, filter: 'blur(4px)' },
    { transform: 'translateY(0) scale(1.05) rotate(' + rot + 'deg)', opacity: 1, filter: 'blur(0)', offset: .14 },
    { transform: 'translateY(' + (-rise * 0.55) + 'px) scale(1) rotate(' + rot2 + 'deg)', opacity: 1, filter: 'blur(0)', offset: .65 },
    { transform: 'translateY(' + (-rise) + 'px) scale(.95) rotate(' + rot2 + 'deg)', opacity: 0, filter: 'blur(1px)' }
  ], { duration: rand(2800, 3600), easing: 'cubic-bezier(.3,.6,.4,1)', fill: 'forwards' });
  rec.anim.onfinish = function(){ remove(rec); };
}

function remove(rec){
  stickers = stickers.filter(function(x){ return x !== rec; });
  rec.el.remove();
}
function fadeAway(rec){
  if (!rec) return;
  stickers = stickers.filter(function(x){ return x !== rec; });
  rec.anim.pause();
  rec.el.animate([{ opacity: getComputedStyle(rec.el).opacity }, { opacity: 0 }],
    { duration: 500, easing: 'ease-out', fill: 'forwards' }).onfinish = function(){ rec.el.remove(); };
}

/* ---------- 里程碑：每個心情每累計滿 50 次（50、100、150…）就慶祝一次 ----------
   那個 emoji 從一般大小長到滿版那麼大，下面寫「謝謝大家！」，全螢幕灑彩帶。
   工具列的「謝謝大家」按鈕可以在活動最後手動謝幕（用全場最多的那個 emoji）。 */
var EVERY = 50;
var reached = {}, celebrating = false, celebrateQueue = [];

function milestoneOf(n){ return Math.floor(n / EVERY) * EVERY; }
function syncMilestones(){ MOODS.forEach(function(m){ reached[m.e] = milestoneOf(Store.totals[m.e] || 0); }); }
function topEmoji(){
  var best = MOODS[0].e, n = -1;
  MOODS.forEach(function(m){ var v = Store.totals[m.e] || 0; if (v > n){ n = v; best = m.e; } });
  return { e: best, n: Math.max(0, n) };
}
function checkMilestone(emoji){
  var m = milestoneOf(Store.totals[emoji] || 0);
  if (m > (reached[emoji] || 0)){ reached[emoji] = m; celebrate(emoji, m, false); }
}

function celebrate(emoji, n, finale){
  if (celebrating){ celebrateQueue.push([emoji, n, finale]); return; }
  celebrating = true;
  var mood = MOODS.find(function(x){ return x.e === emoji; });
  var d = document.createElement('div'); d.className = 'thanks';
  d.innerHTML = '<span class="e"></span><span class="t">謝謝大家！</span><span class="s"></span>';
  d.querySelector('.e').textContent = emoji;
  d.querySelector('.s').textContent = finale
    ? '全場最多的心情：' + (mood ? mood.t : '') + '　共 ' + n.toLocaleString() + ' 次'
    : (mood ? mood.t : '') + ' 已經 ' + n.toLocaleString() + ' 次了';
  document.body.appendChild(d);

  var hold = finale ? 7000 : 4600;
  var e = d.querySelector('.e');
  e.style.fontSize = finale ? '42vh' : '32vh';
  // emoji 從一般大小慢慢長大，最後停在很大
  e.animate([
    { transform: 'scale(.12) rotate(-12deg)' },
    { transform: 'scale(.7) rotate(6deg)', offset: .45 },
    { transform: 'scale(1.06) rotate(-3deg)', offset: .8 },
    { transform: 'scale(1) rotate(0deg)' }
  ], { duration: 1600, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'forwards' });
  d.querySelectorAll('.t,.s').forEach(function(x, i){
    x.animate([{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'translateY(0)' }],
      { duration: 700, delay: 900 + i * 250, easing: 'ease-out', fill: 'both' });
  });
  confetti(finale ? 6000 : 3800, finale ? 320 : 200);

  d.animate([{ opacity: 1 }, { opacity: 1, offset: .85 }, { opacity: 0 }], { duration: hold, fill: 'forwards' })
    .onfinish = function(){
      d.remove();
      setTimeout(function(){
        celebrating = false;
        var next = celebrateQueue.shift();
        if (next) celebrate(next[0], next[1], next[2]);
      }, 600);
    };
}

/* ---------- 彩帶：自己畫在 canvas 上，不載外掛函式庫 ----------
   一半是小紙片，一半是細長的彩帶條，翻轉時用 cos 壓扁寬度做出立體感。 */
var CONFETTI_COLORS = ['#A61B22', '#E0A526', '#2F7D6B', '#3B6AA8', '#E58AA0', '#F3C969', '#7E3B1E', '#8FB8DE'];
var confettiParts = [], confettiUntil = 0, confettiRunning = false;

function confetti(duration, count){
  var cv = $('confetti'), W = innerWidth, H = innerHeight, dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  if (reduced) count = Math.round(count / 4);
  for (var i = 0; i < count; i++){
    var ribbon = Math.random() < 0.45;
    confettiParts.push({
      x: rand(0, W), y: rand(-H * 0.9, -20),
      w: ribbon ? rand(5, 8) : rand(8, 13), h: ribbon ? rand(26, 46) : rand(10, 16),
      vx: rand(-1.2, 1.2), vy: rand(2.2, 4.6), sway: rand(0.6, 1.8), phase: rand(0, 6.28),
      rot: rand(0, 6.28), vr: rand(-0.12, 0.12), flip: rand(0.05, 0.14),
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)]
    });
  }
  confettiUntil = Math.max(confettiUntil, Date.now() + duration);
  if (!confettiRunning){ confettiRunning = true; requestAnimationFrame(confettiFrame); }
}

function confettiFrame(){
  var cv = $('confetti'), g = cv.getContext('2d'), dpr = cv.width / innerWidth, H = innerHeight;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, innerWidth, H);
  var ending = Date.now() > confettiUntil;
  confettiParts = confettiParts.filter(function(p){
    p.phase += 0.05; p.rot += p.vr;
    p.x += p.vx + Math.sin(p.phase) * p.sway;
    p.y += p.vy;
    if (p.y > H + 60){
      if (ending) return false;
      p.y = rand(-80, -20); p.x = rand(0, innerWidth);   // 時間還沒到就從上面再落一次
    }
    g.save();
    g.translate(p.x, p.y); g.rotate(p.rot);
    g.scale(Math.cos(p.phase * p.flip * 20), 1);
    g.fillStyle = p.color;
    g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    g.restore();
    return true;
  });
  if (confettiParts.length) requestAnimationFrame(confettiFrame);
  else { confettiRunning = false; g.clearRect(0, 0, innerWidth, H); }
}

/* ============================================================
   下載：留言 Excel、文字雲圖片
   xlsx 產生器沿用互動文字雲那一套（不壓縮的 ZIP＋幾份 XML，不必載 SheetJS）
   ============================================================ */
var CRC_TABLE = (function(){
  var tbl = new Uint32Array(256);
  for (var n = 0; n < 256; n++){
    var c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    tbl[n] = c >>> 0;
  }
  return tbl;
})();

function crc32(bytes){
  var crc = 0xFFFFFFFF;
  for (var i = 0; i < bytes.length; i++){
    crc = CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

/* 只做 store（不壓縮）的 ZIP —— xlsx 完全接受，也省掉實作 deflate */
function makeZip(files){
  var enc = new TextEncoder();
  var parts = [], central = [], offset = 0;

  files.forEach(function(f){
    var name = enc.encode(f.name);
    var data = enc.encode(f.xml);
    var crc = crc32(data);

    var lh = new Uint8Array(30 + name.length);
    var d = new DataView(lh.buffer);
    d.setUint32(0, 0x04034b50, true);
    d.setUint16(4, 20, true);
    d.setUint16(6, 0x0800, true);   // 檔名用 UTF-8
    d.setUint16(8, 0, true);        // 不壓縮
    d.setUint16(10, 0, true);
    d.setUint16(12, 0x0021, true);  // 1980-01-01
    d.setUint32(14, crc, true);
    d.setUint32(18, data.length, true);
    d.setUint32(22, data.length, true);
    d.setUint16(26, name.length, true);
    d.setUint16(28, 0, true);
    lh.set(name, 30);
    parts.push(lh, data);

    var cd = new Uint8Array(46 + name.length);
    var c = new DataView(cd.buffer);
    c.setUint32(0, 0x02014b50, true);
    c.setUint16(4, 20, true);
    c.setUint16(6, 20, true);
    c.setUint16(8, 0x0800, true);
    c.setUint16(10, 0, true);
    c.setUint16(12, 0, true);
    c.setUint16(14, 0x0021, true);
    c.setUint32(16, crc, true);
    c.setUint32(20, data.length, true);
    c.setUint32(24, data.length, true);
    c.setUint16(28, name.length, true);
    c.setUint32(42, offset, true);
    cd.set(name, 46);
    central.push(cd);

    offset += lh.length + data.length;
  });

  var cdSize = central.reduce(function(a, b){ return a + b.length; }, 0);
  var eocd = new Uint8Array(22);
  var e = new DataView(eocd.buffer);
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, files.length, true);
  e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true);
  e.setUint32(16, offset, true);

  return new Blob(parts.concat(central, [eocd]),
    { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}

function xmlEscape(s){
  return String(s).replace(/[&<>"']/g, function(ch){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&apos;' }[ch];
  }).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');   // 控制字元會讓 Excel 拒開
}

function colName(i){
  var s = '';
  i += 1;
  while (i > 0){
    var r = (i - 1) % 26;
    s = String.fromCharCode(65 + r) + s;
    i = Math.floor((i - 1) / 26);
  }
  return s;
}

/* rows：二維陣列，數字寫成數值格、其餘寫成文字 */
function sheetXml(rows){
  var body = rows.map(function(row, r){
    var cells = row.map(function(v, c){
      var ref = colName(c) + (r + 1);
      if (typeof v === 'number' && isFinite(v)){
        return '<c r="' + ref + '"><v>' + v + '</v></c>';
      }
      return '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' +
             xmlEscape(v == null ? '' : v) + '</t></is></c>';
    }).join('');
    return '<row r="' + (r + 1) + '">' + cells + '</row>';
  }).join('');

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">' +
    '<sheetData>' + body + '</sheetData></worksheet>';
}

function buildWorkbook(sheets){
  var files = [];

  files.push({ name: '[Content_Types].xml', xml:
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
    sheets.map(function(s, i){
      return '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ' +
             'ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    }).join('') +
    '</Types>' });

  files.push({ name: '_rels/.rels', xml:
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
    '</Relationships>' });

  files.push({ name: 'xl/workbook.xml', xml:
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" ' +
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>' +
    sheets.map(function(s, i){
      return '<sheet name="' + xmlEscape(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
    }).join('') +
    '</sheets></workbook>' });

  files.push({ name: 'xl/_rels/workbook.xml.rels', xml:
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    sheets.map(function(s, i){
      return '<Relationship Id="rId' + (i + 1) + '" ' +
             'Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" ' +
             'Target="worksheets/sheet' + (i + 1) + '.xml"/>';
    }).join('') +
    '</Relationships>' });

  sheets.forEach(function(s, i){
    files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', xml: sheetXml(s.rows) });
  });

  return makeZip(files);
}

function downloadBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}

function fileStamp(){
  var d = new Date();
  function p(n){ return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
         '_' + p(d.getHours()) + p(d.getMinutes());
}

function safeName(s){ return String(s).replace(/[\\/:*?"<>|\s]/g, '_').slice(0, 40); }
function localTime(v){
  var d = new Date(v); if (isNaN(d)) return '';
  function p(n){ return (n < 10 ? '0' : '') + n; }
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

/* 匯出要撈「全部」：包含已從牆上移除的，也不受畫面 1000 筆上限影響
   （PostgREST 一次最多回 1000 筆，所以分頁撈） */
async function fetchAllMessages(){
  if (!sb){
    var demo = Array.from(Store.messages.values()).filter(function(m){ return m.id < 0; });
    return localLoad('msgs', []).concat(demo);
  }
  var all = [], page = 0, SIZE = 1000;
  while (true){
    var r = await sb.from('wall_messages').select('id,name,body,mood,keyword,hidden,created_at')
      .eq('room', ROOM).order('id').range(page * SIZE, page * SIZE + SIZE - 1);
    if (r.error) throw r.error;
    all = all.concat(r.data);
    if (r.data.length < SIZE) return all;
    page++;
  }
}

async function exportExcel(){
  var btn = $('tExcel'), label = btn.textContent;
  btn.disabled = true; btn.textContent = '整理中…';
  try {
    var rows = await fetchAllMessages();
    if (!rows.length){ alert('目前還沒有留言可以下載'); return; }
    var moodName = {}; MOODS.forEach(function(m){ moodName[m.e] = m.t; });

    var msgSheet = [['序號', '送出時間', '姓名', '留言內容', '心情', '心情說明', '關鍵詞', '狀態']];
    rows.forEach(function(m, i){
      msgSheet.push([i + 1, localTime(m.created_at), m.name || '', m.body, m.mood || '',
                     moodName[m.mood] || '', m.keyword || '', m.hidden ? '已從牆上移除' : '顯示中']);
    });

    var wordSheet = [['名次', '關鍵詞', '出現次數']];
    countWords(rows.filter(function(m){ return !m.hidden; })).forEach(function(w, i){ wordSheet.push([i + 1, w.text, w.n]); });

    var moodSheet = [['心情', '說明', '累計次數']], sum = 0;
    MOODS.forEach(function(m){ var n = Store.totals[m.e] || 0; sum += n; moodSheet.push([m.e, m.t, n]); });
    moodSheet.push(['', '合計', sum]);

    var shown = rows.filter(function(m){ return !m.hidden; }).length;
    var info = [['活動', TITLE], ['場次代號', ROOM], ['匯出時間', localTime(new Date())],
                ['留言總數', rows.length], ['牆上顯示中', shown], ['已移除', rows.length - shown], ['心情互動總次數', sum]];

    downloadBlob(buildWorkbook([
      { name: '留言', rows: msgSheet },
      { name: '關鍵詞統計', rows: wordSheet },
      { name: '心情統計', rows: moodSheet },
      { name: '活動摘要', rows: info }
    ]), '留言牆_' + safeName(TITLE) + '_' + fileStamp() + '.xlsx');
  } catch (e){
    alert('下載失敗：' + (e && e.message ? e.message : e));
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

/* 文字雲存成 JPG：不是截圖，是照每個詞「目標」的位置與字級在 canvas 上以 3 倍解析度重畫。
   讀 style 而不是 offsetLeft —— 字還在 transition 途中時，offset 量到的是半路的值。 */
function exportCloudImage(){
  var box = $('wallCloud');
  var words = [].slice.call(box.querySelectorAll('.w'));
  if (!words.length){ alert('文字雲還沒有內容'); return; }
  var W = box.clientWidth, H = box.clientHeight, S = 3, TOP = 70, FOOT = 40;
  var cv = document.createElement('canvas');
  cv.width = Math.round(W * S); cv.height = Math.round((H + TOP + FOOT) * S);
  var g = cv.getContext('2d'); g.scale(S, S);
  g.fillStyle = '#F6F0E6'; g.fillRect(0, 0, W, H + TOP + FOOT);   // JPG 沒有透明，底色要自己鋪

  // 刊頭：紅色印章「厝」＋活動名稱
  g.fillStyle = '#A61B22'; g.fillRect(16, 16, 38, 38);
  g.fillStyle = '#F6F0E6'; g.font = '900 24px "Noto Serif TC",serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('厝', 35, 36);
  g.fillStyle = '#2B2622'; g.textAlign = 'left'; g.font = '900 19px "Noto Serif TC",serif';
  g.fillText(TITLE, 64, 28);
  g.fillStyle = '#5E554D'; g.font = '500 12px "Noto Sans TC",sans-serif';
  g.fillText('大家的關鍵詞 · 出現越多次字越大', 64, 47);
  g.fillStyle = '#D9CCB8'; g.fillRect(16, TOP - 6, W - 32, 1);

  words.forEach(function(el){
    var size = parseFloat(el.style.fontSize), x = parseFloat(el.style.left), y = parseFloat(el.style.top) + TOP;
    g.save();
    g.globalAlpha = parseFloat(el.style.opacity) || 1;
    g.fillStyle = el.style.color;
    g.font = el.style.fontWeight + ' ' + size + 'px "Noto Serif TC","Songti TC",serif';
    g.textBaseline = 'middle';
    if (el.classList.contains('v')){
      g.textAlign = 'center';
      el.textContent.split('').forEach(function(ch, i){ g.fillText(ch, x + size * 0.56, y + size * 1.06 * (i + 0.5)); });
    } else {
      g.textAlign = 'left';
      g.fillText(el.textContent, x, y + size * 0.5);
    }
    g.restore();
  });

  g.fillStyle = '#5E554D'; g.font = '500 12px "Noto Sans TC",sans-serif'; g.textBaseline = 'middle';
  g.textAlign = 'left'; g.fillText(localTime(new Date()).slice(0, 16), 16, H + TOP + FOOT / 2);
  g.textAlign = 'right'; g.fillText('共 ' + Store.messages.size + ' 則留言', W - 16, H + TOP + FOOT / 2);

  cv.toBlob(function(blob){
    if (blob) downloadBlob(blob, '文字雲_' + safeName(TITLE) + '_' + fileStamp() + '.jpg');
  }, 'image/jpeg', 0.92);
}

/* ---------- QR ---------- */
function guestUrl(){
  var u = new URL(location.href);
  ['wall', 'demo', 'admin'].forEach(function(k){ u.searchParams.delete(k); });
  return u.toString();
}
function padQuietZone(src){
  var q = Math.round(src.width * 0.16), c = document.createElement('canvas');
  c.width = src.width + q * 2; c.height = src.height + q * 2;
  var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.imageSmoothingEnabled = false; g.drawImage(src, q, q);
  return c;
}
function drawQr(){
  var box = $('qr'), url = guestUrl();
  if (location.protocol === 'file:' || !window.QRCode){
    box.innerHTML = '<div class="ph">上線後<br>這裡會出現<br>QR Code</div>';
    return;
  }
  var tmp = document.createElement('div');
  new QRCode(tmp, { text: url, width: 1024, height: 1024, colorDark: '#2B2622', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
  var src = tmp.querySelector('canvas');
  var c = padQuietZone(src);
  box.innerHTML = ''; box.appendChild(c);
  box.appendChild(document.createTextNode('掃碼留言'));
  box.onclick = function(){
    var big = document.createElement('div'); big.className = 'qrbig';
    var cc = padQuietZone(src);
    big.appendChild(cc);
    var p = document.createElement('p'); p.textContent = '掃描 QR Code，寫下你的感受'; big.appendChild(p);
    big.onclick = function(){ big.remove(); };
    document.body.appendChild(big);
  };
}
